jdbc.driver=${DB_DRIVER:net.sf.log4jdbc.sql.jdbcapi.DriverSpy}
jdbc.url=${DB_URL:jdbc:log4jdbc:mysql://localhost:3306/firstfolio_db?serverTimezone=UTC&characterEncoding=UTF-8}
jdbc.username=${DB_USERNAME:firstfolio}
jdbc.password=${DB_PASSWORD:}

firebase.project-id=${FIREBASE_PROJECT_ID:}

content.storage.type=${CONTENT_STORAGE_TYPE:local}
content.storage.local-root=${CONTENT_LOCAL_ROOT:./.local/content}
content.storage.max-bytes=${CONTENT_STORAGE_MAX_BYTES:5242880}
content.storage.s3.bucket=${CONTENT_S3_BUCKET:}
content.storage.s3.prefix=${CONTENT_S3_PREFIX:firstfolio}
content.storage.s3.region=${AWS_REGION:}

auth.terms-of-service-version=${TERMS_OF_SERVICE_VERSION:}
auth.privacy-policy-version=${PRIVACY_POLICY_VERSION:}

internal.call-token=${INTERNAL_CALL_TOKEN:}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
