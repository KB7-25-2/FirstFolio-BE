global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: firstfolio-be
    metrics_path: /internal/metrics
    scheme: http
    http_headers:
      X-Internal-Token:
        files:
          - /run/secrets/internal_call_token
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          application: firstfolio-be
          instance: firstfolio-be
