name: firstfolio-be-deploy

services:
  be-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: firstfolio-be:deploy
    env_file:
      - .env.deploy
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      # Firebase 키는 이미지에 넣지 않고 호스트 파일을 읽기 전용으로 마운트한다.
      - ${FIREBASE_KEY_PATH:-/opt/firstfolio/firebase-admin.json}:/run/secrets/firebase-admin.json:ro
      - content-data:/var/firstfolio/content
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  content-data:
